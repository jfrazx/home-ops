---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent

spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore

  target:
    name: hermes-agent-secret
    creationPolicy: Owner
    deletionPolicy: Delete

    template:
      engineVersion: v2
      data:
        API_SERVER_KEY: "{{ .api_server_key }}"
        # Uncomment once ready to wire up Home Assistant (see helmrelease.yaml HASS_URL)
        # HASS_TOKEN: "{{ .hass_token }}"

  data:
    - secretKey: api_server_key
      remoteRef:
        key: ai/hermes-agent/credentials
        property: api_server_key
    # - secretKey: hass_token
    #   remoteRef:
    #     key: ai/hermes-agent/credentials
    #     property: hass_token
