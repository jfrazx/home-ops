---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes-agent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      hermes-agent:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.30

            args: ["gateway", "run"]

            env:
              # Model provider - routed at the in-cluster Ollama instance
              OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              OPENAI_API_KEY: "ollama" # dummy value, Ollama does not validate it
              HERMES_MODEL: "qwen3:8b"

              # --- Home Assistant (disabled until ready) ---
              # HASS_TOKEN comes from hermes-agent-secret (see externalsecret.yaml) once uncommented there
              # HASS_URL: "http://homeassistant.local:8123"

            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: 8642

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        globalMounts:
          - path: /opt/data

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Self-improving AI agent with persistent memory
          gethomepage.dev/group: LLM/Ai
          gethomepage.dev/name: Hermes Agent
          gethomepage.dev/app: *app
        hostnames: ["hermes.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
