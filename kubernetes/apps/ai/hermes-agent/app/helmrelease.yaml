---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes-agent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      hermes-agent:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.13@sha256:68e15ae2a6d894d0ccbd9f8aacbbe13d4d28fa5dc9b6a303970b67bb2499b1a6

            args: ["gateway", "run"]

            env:
              # Model provider - routed at the in-cluster Ollama instance
              OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              OPENAI_API_KEY: "ollama" # dummy value, Ollama does not validate it

              # Defaults to 127.0.0.1 - required for the Service/HTTPRoute to reach it.
              # The app logs its own warning about this: with terminal.backend=local
              # (default, unsandboxed), a network-accessible bind means anything that
              # reaches this endpoint with the API key can run terminal/file tools as
              # the container user. Bearer-key auth is enforced (verified live) and
              # this only reaches the internal gateway, not the public internet - but
              # worth revisiting terminal.backend: docker if that changes.
              API_SERVER_HOST: "0.0.0.0"

              # Dashboard already defaults to a 0.0.0.0 bind, which means its auth
              # gate is mandatory (fails closed without a provider - hardened after
              # a real incident with unauthenticated public dashboards). Basic-auth
              # creds come from hermes-agent-secret via envFrom below.
              HERMES_DASHBOARD: "1"

              # --- Home Assistant (disabled until ready) ---
              # HASS_TOKEN comes from hermes-agent-secret (see externalsecret.yaml) once uncommented there
              # HASS_URL: "http://homeassistant.local:8123"

            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"

            # The image's s6-overlay entrypoint starts as root and drops privileges
            # twice: once for its own cont-init setup (needs SETUID/SETGID/CHOWN),
            # then again per-service when launching dashboard/main-hermes, which
            # touch root-owned supervision dirs under /run (needs DAC_OVERRIDE/FOWNER
            # to bypass that ownership check as the now-unprivileged "hermes" user).
            # Verified live: SETUID/SETGID/CHOWN alone is NOT sufficient - services
            # fail to start with "Permission denied" without the latter two as well.
            # Running fully non-root (runAsUser) was also tried and fails earlier -
            # s6-overlay's own preinit hard-requires /run to already match its uid.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SETUID
                  - SETGID
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &apiPort 8642
          dashboard:
            port: &dashboardPort 9119

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        globalMounts:
          - path: /opt/data

    route:
      app:
        hostnames: ["hermes.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *apiPort
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: >-
            Self-improving AI agent with persistent memory ·
            {{ if eq (index .Values.route.dashboard.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
          gethomepage.dev/group: LLM/Ai
          gethomepage.dev/name: Hermes Agent
          gethomepage.dev/app: *app
        hostnames: ["hermes-dashboard.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *dashboardPort
