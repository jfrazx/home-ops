---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sdnext
spec:
  interval: 1h
  # First start clones SD.Next into /app and installs torch/IPEX (several GB)
  # into /mnt/python before the port opens. The 5m default timed out, and each
  # failed install's uninstall remediation deleted the chart-generated PVCs --
  # that is where the pile of Released sdnext PVs came from. Every volume is
  # now an existingClaim, so a failed install can no longer touch storage.
  timeout: 60m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      sdnext:
        replicas: 1
        strategy: Recreate

        # kubelet creates missing subPath dirs as root, which the non-root app
        # then can't write. Pre-create them as 1001. (Mounting the volume
        # straight at /app doesn't work either: ext4's lost+found makes the
        # entrypoint's `git clone .` fail on a non-empty directory.)
        initContainers:
          init-dirs:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command: ["sh", "-c", "mkdir -p /runtime/app /runtime/python"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

        containers:
          app:
            image:
              repository: disty0/sdnext-ipex
              tag: latest
              pullPolicy: IfNotPresent

            # The image ENTRYPOINT already passes --use-ipex --listen and reads
            # SD_DATADIR=/mnt/data and SD_MODELSDIR=/mnt/models from its own
            # env; extra flags must go in args (a CLI_ARGS env is ignored).
            # SD.Next's argparse rejects unknown flags and exits 2, so check
            # `--help` before adding one (--no-download no longer exists).

            env:
              TZ: "${TIMEZONE}"
              # Non-root with no home directory in the image.
              HOME: /tmp

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7860
                  # Up to an hour for the first-start dependency install;
                  # later starts reuse the persisted venv and take seconds.
                  periodSeconds: 10
                  failureThreshold: 360

            resources:
              requests:
                gpu.intel.com/i915: "1"
                cpu: 1000m
                memory: 4Gi
              limits:
                gpu.intel.com/i915: "1"
                # The iGPU has no dedicated VRAM; model weights live in
                # system RAM, so this bounds what models can load.
                memory: 16Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      app:
        controller: *app
        ports:
          http:
            port: 7860

    persistence:
      # Settings, outputs and user state; backed up by volsync.
      data:
        existingClaim: sdnext-config
        globalMounts:
          - path: /mnt/data

      # Git checkout and venv. Reproducible, so not backed up, but persisted
      # so restarts don't repeat the multi-GB install.
      runtime:
        existingClaim: sdnext-runtime
        advancedMounts:
          sdnext:
            init-dirs:
              - path: /runtime
            app:
              - path: /app
                subPath: app
              - path: /mnt/python
                subPath: python

      models:
        existingClaim: sdnext-models
        globalMounts:
          - path: /mnt/models

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: >-
            Stable Diffusion image generation ·
            {{ if eq (index .Values.route.app.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
          gethomepage.dev/group: LLM/Ai
          gethomepage.dev/icon: mdi-image-auto-adjust
          gethomepage.dev/name: SD.Next
          gethomepage.dev/app: *app
        hostnames: ["sdnext.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
