---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app docs-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      # The worker owns the store: it runs every scrape/refresh pipeline and
      # serves search over RPC. The MCP endpoint (see mcpserver.yaml), the web
      # UI and the sync job are all thin clients pointed at its /api.
      worker:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app: &container
            image:
              repository: ghcr.io/arabold/docs-mcp-server
              tag: 3.0.0

            command:
              - node
              - --enable-source-maps
              - /app/dist/index.js

            args:
              - worker
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --no-logo

            env: &env
              TZ: "${TIMEZONE}"
              # PostHog analytics ship enabled by default upstream.
              DOCS_MCP_TELEMETRY: "false"
              # Embeddings run locally against Ollama via its OpenAI-compatible
              # API. The parser splits on the FIRST colon only, so the model's
              # own ":300m" tag survives intact.
              OPENAI_API_BASE: http://ollama.ai.svc.cluster.local:11434/v1
              OPENAI_API_KEY: ollama
              DOCS_MCP_EMBEDDING_MODEL: openai:embeddinggemma:300m

            envFrom: &envFrom
              - secretRef:
                  name: "{{ .Release.Name }}-secret"

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe

            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi

            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

      # Browser-based index management. Read/write, so it stays on the internal
      # gateway only.
      web:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            <<: *container
            args:
              - web
              - --host
              - 0.0.0.0
              - --port
              - "6281"
              - --server-url
              - &serverUrl http://docs-mcp-worker.ai.svc.cluster.local:8080/api
              - --no-logo

            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6281
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *webProbe

            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

      # NOTE: a GitHub webhook receiver (resources/webhook.js) is written and
      # tested but intentionally not deployed. Refreshing is cron-driven for now.
      # To enable it, restore the `webhook` controller/service/route here, add
      # webhook.js back to the configMapGenerator, and restore the
      # GITHUB_WEBHOOK_SECRET entry in externalsecret.yaml.

      # Keeps the index fresh; it does not decide what is in it. Libraries are
      # added and removed through the web UI, and this refreshes whatever the
      # store reports -- upstream has no scheduler of its own. Cheap to run
      # often: unchanged pages return 304 and skip the pipeline entirely.
      sync:
        type: cronjob

        annotations:
          reloader.stakater.com/auto: "true"

        cronjob:
          schedule: "0 3 * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 3600
          backoffLimit: 0
          activeDeadlineSeconds: 3600

        containers:
          app:
            <<: *container
            command:
              - /bin/sh
            args:
              - /etc/docs-mcp/sync.sh

            env:
              <<: *env
              DOCS_MCP_SERVER_URL: *serverUrl

            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false

            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # The image ships an unprivileged `node` user at uid/gid 1000 and drops
        # to it in the Dockerfile; /data must be group-writable for that user.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      worker:
        controller: worker
        ports:
          http:
            port: 8080
      web:
        controller: web
        ports:
          http:
            port: 6281

    persistence:
      # SQLite store plus vector index. Only the worker touches it, so RWO on
      # ceph-block is enough.
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: ceph-block
        advancedMounts:
          worker:
            app:
              - path: /data

      # XDG_CONFIG_HOME. Written at startup, so it cannot live on the read-only
      # root filesystem.
      config:
        type: emptyDir
        globalMounts:
          - path: /config

      scripts:
        type: configMap
        name: docs-mcp-configmap
        defaultMode: 0555
        globalMounts:
          - path: /etc/docs-mcp
            readOnly: true

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      web:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: >-
            Local documentation index for AI assistants ·
            {{ if eq (index .Values.route.web.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
          gethomepage.dev/group: LLM/Ai
          gethomepage.dev/icon: mdi-book-search
          gethomepage.dev/name: Docs MCP
          gethomepage.dev/app: *app
        hostnames: ["docs-mcp.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: web
                port: 6281
