---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-mcp

spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore

  target:
    name: docs-mcp-secret
    creationPolicy: Owner
    deletionPolicy: Delete

    template:
      engineVersion: v2
      data:
        # Used by the GitHub scraper strategy. Raises the API rate limit and is
        # required for any private repo listed in resources/repos.txt.
        GITHUB_TOKEN: "{{ .github_token }}"
        # Restore alongside the webhook controller in helmrelease.yaml. Left out
        # for now because a property missing from OpenBao fails the entire
        # ExternalSecret, which would take GITHUB_TOKEN down with it.
        # GITHUB_WEBHOOK_SECRET: "{{ .webhook_secret }}"

  data:
    - secretKey: github_token
      remoteRef:
        key: ai/docs-mcp/credentials
        property: github_token
    # - secretKey: webhook_secret
    #   remoteRef:
    #     key: ai/docs-mcp/credentials
    #     property: webhook_secret
