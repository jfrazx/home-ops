---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./mcpserver.yaml
configMapGenerator:
  - name: docs-mcp-configmap
    files:
      - ./resources/sync.sh
      - ./resources/list-libraries.mjs
      - ./resources/warm-embeddings.mjs
      # Parked with the webhook controller; restore both together.
      # - ./resources/webhook.js
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # sync.sh (and webhook.js) are full of ${...} shell/JS expansions; Flux
    # postBuild substitution would replace every one of them with an empty
    # string and leave a script that runs but does nothing.
    kustomize.toolkit.fluxcd.io/substitute: disabled
