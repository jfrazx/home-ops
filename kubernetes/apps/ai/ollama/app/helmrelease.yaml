---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ollama
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      ollama:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          priorityClassName: gpu-workload-high
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"

        containers:
          app:
            image:
              repository: ghcr.io/jfrazx/ollama-sycl
              tag: 0.32.6@sha256:a6e20c7e4a53531551c7c4c73f4fe2e11779aa360ce1494c140620d61e3138b2

            env:
              OLLAMA_MODELS: &modelPath /models
              OLLAMA_HOST: "0.0.0.0"
              NO_PROXY: "localhost,127.0.0.1"
              ONEAPI_DEVICE_SELECTOR: "level_zero:0"
              ZES_ENABLE_SYSMAN: "1"
              SYCL_CACHE_PERSISTENT: "1"
              SYCL_CACHE_DIR: /root/.ollama/sycl_cache
              SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS: "1"
              UR_L0_USE_IMMEDIATE_COMMANDLISTS: "1"
              GGML_SYCL_F16: "1"
              # Integrated Arc GPU shares system RAM; the driver only exposes a
              # small dedicated VRAM window (~2.2GiB) by default, which isn't
              # enough to offload most models (verified: 0/34 layers offloaded,
              # ~4.6 tok/s, effectively CPU-only). This env var is read at
              # runtime by ggml-sycl (confirmed in ggml/src/ggml-sycl.cpp) and
              # widens Ollama's reported free device memory, letting it offload
              # fully. Verified live: 34-37/34-37 layers offloaded, ~7.6 tok/s.
              # Note: this hardware doesn't actually support the zero-copy USM
              # allocation path (logs: "Device does not support USM system
              # allocations") - the gain comes from the memory availability
              # check alone, not the intended fast path.
              GGML_SYCL_USM_SYSTEM: "1"
              OLLAMA_FLASH_ATTENTION: "true"
              OLLAMA_KV_CACHE_TYPE: "q4_0"
              OLLAMA_NUM_GPU: "999"
              OLLAMA_NUM_PARALLEL: "1"
              OLLAMA_MAX_LOADED_MODELS: "1"
              OLLAMA_KEEP_ALIVE: "2h"

            resources:
              requests:
                cpu: "2"
                memory: "12Gi"
                gpu.intel.com/i915: 1
              limits:
                cpu: "8"
                memory: "24Gi"
                gpu.intel.com/i915: 1

            # readOnlyRootFilesystem intentionally omitted - SYCL_CACHE_PERSISTENT
            # writes a kernel cache under $HOME, which isn't backed by a volume here.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11434
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11434
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup: *probe

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 11434

    persistence:
      models:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        size: 250Gi
        storageClass: truenas-nfs
        advancedMounts:
          ollama:
            app:
              - path: *modelPath

      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        advancedMounts:
          ollama:
            app:
              - path: /root/.ollama

      dev:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - readOnly: true

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
