---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: immich
  namespace: ai
spec:
  image: ghcr.io/barryw/immichmcp:v3.3.5@sha256:45acbcd7fb7ab766e1edad00cb5d3a2b849f1f6ecbadeb14771d1413bb241187
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 5000

  env:
    - name: IMMICH_BASE_URL
      value: http://immich-server.media.svc.cluster.local:2283
    # Remote clients enable tool categories on demand rather than loading
    # every tool up front.
    - name: IMMICH_TOOL_MODE
      value: gateway

  secrets:
    - name: immich-mcp-secret
      key: IMMICH_API_KEY
      targetEnvName: IMMICH_API_KEY

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
