---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname csi-selinux-relabel
  namespace: &namespace storage
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/storage/csi-selinux-relabel/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Same reasoning as fstrim: a DaemonSet's readiness depends on every node
  # being schedulable, so waiting here would make one unreachable node fail this
  # Kustomization. Nothing depends on this app, and it is not on any data path.
  wait: false
