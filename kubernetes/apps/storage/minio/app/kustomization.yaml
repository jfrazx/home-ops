---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./prometheusRule.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: minio-dashboards
    options:
      annotations:
        grafana_folder: Storage
      labels:
        grafana_dashboard: "1"
    files:
      - ./dashboards/minio-cluster.json
      - ./dashboards/minio-node.json
      - ./dashboards/minio-bucket.json
