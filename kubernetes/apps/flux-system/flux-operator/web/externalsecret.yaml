---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: flux-web-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Authentik redirect URI: https://gitops.${SECRET_DOMAIN}/oauth2/callback
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://gitops.${SECRET_DOMAIN}
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: "{{ .oidc_client_id }}"
                clientSecret: "{{ .oidc_client_secret }}"
                issuerURL: "{{ .oidc_issuer }}"
                # authentik puts `groups` in the profile scope; there is no
                # separate groups scope to request.
                scopes: [openid, profile, email]
                autoLogin: true
                # No email_verified check: authentik's default email mapping
                # reports false for every user.
                profile:
                  name: "has(claims.name) ? claims.name : claims.preferred_username"
                impersonation:
                  username: "claims.preferred_username"
                  groups: "claims.groups"
  data:
    - secretKey: oidc_client_id
      remoteRef:
        key: flux-system/flux-operator/oidc
        property: client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: flux-system/flux-operator/oidc
        property: client_secret
    - secretKey: oidc_issuer
      remoteRef:
        key: flux-system/flux-operator/oidc
        property: issuer
