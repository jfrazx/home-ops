---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret paperless-secret
  namespace: documents
spec:
  # NOTE: 12h, not the 5m this used before the move to documents-postgres. The
  # password32 generator below mints a *new* password on every refresh, and the
  # controller carries reloader.stakater.com/auto -- at 5m paperless would
  # restart every five minutes chasing a password that keeps changing.
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: *secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # App
        PAPERLESS_SECRET_KEY: "{{ .secret_key }}"
        PAPERLESS_ADMIN_USER: "{{ .admin_user }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .admin_password }}"
        PAPERLESS_ADMIN_MAIL: "{{ .admin_email }}"
        PAPERLESS_REDIS: "redis://:{{ .redis_password | urlquery }}@dragonflydb.database.svc.cluster.local:6379/4"
        # PAPERLESS_SOCIALACCOUNT_PROVIDERS: "{{ .social_account_providers }}"
        PAPERLESS_APPS: "{{ .paperless_apps }}"

        # Database
        #
        # The app talks to the pooler; postgres-init talks straight to -rw.
        # postgres-init issues DDL (CREATE ROLE / CREATE DATABASE), and
        # CREATE DATABASE cannot run inside a transaction block, so it has no
        # business going through a transaction-mode pgbouncer. Everything else
        # -- name, user, password -- is shared by anchor so the two can't drift.
        PAPERLESS_DBHOST: documents-postgres-pooler.documents.svc.cluster.local
        PAPERLESS_DBPORT: "5432"
        PAPERLESS_DBNAME: &dbname paperless
        PAPERLESS_DBUSER: &dbuser paperless
        PAPERLESS_DBPASS: &dbpass "{{ .DB_PASSWORD }}"

        # Postgres Init
        INIT_POSTGRES_HOST: documents-postgres-rw.documents.svc.cluster.local
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass

  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"

  data:
    - secretKey: secret_key
      remoteRef:
        key: documents/paperless/config
        property: secret_key
    - secretKey: social_account_providers
      remoteRef:
        key: documents/paperless/config
        property: social_account_providers
    - secretKey: paperless_apps
      remoteRef:
        key: documents/paperless/config
        property: apps

    - secretKey: redis_password
      remoteRef:
        key: database/dragonflydb/credentials
        property: password

    - secretKey: admin_user
      remoteRef:
        key: documents/paperless/credentials
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: documents/paperless/credentials
        property: admin_password
    - secretKey: admin_email
      remoteRef:
        key: documents/paperless/credentials
        property: admin_email
