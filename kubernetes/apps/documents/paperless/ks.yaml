---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
  namespace: flux-system
spec:
  targetNamespace: documents
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: documents-postgres
    - name: dragonflydb-cluster
      namespace: flux-system
    - name: openbao
      namespace: external-secrets
  interval: 10m
  path: ./kubernetes/apps/documents/paperless/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CLAIM: paperless-config
      VOLSYNC_REPOSITORY_NAMESPACE: &namespace documents

  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: documents-postgres
      namespace: documents
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: paperless-secret
      namespace: documents
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
