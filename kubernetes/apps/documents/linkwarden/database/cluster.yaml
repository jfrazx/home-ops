---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &app linkwarden-postgres
  namespace: documents
  labels:
    backup/database: "true"
    kustomize.toolkit.fluxcd.io/name: *app
    kustomize.toolkit.fluxcd.io/namespace: flux-system
  annotations:
    reloader.stakater.com/auto: "true"
    kustomize.toolkit.fluxcd.io/substitute: "true"

spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  bootstrap:
    initdb:
      database: linkwarden
      owner: linkwarden
      dataChecksums: true
      encoding: "UTF8"
      localeCType: "en_US.UTF-8"
      localeCollate: "en_US.UTF-8"

  backup:
    target: prefer-standby
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://postgresql-backups/linkwarden
      endpointURL: http://minio.storage.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: linkwarden-postgres-minio
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: linkwarden-postgres-minio
          key: MINIO_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2

  postgresql:
    parameters:
      max_slot_wal_keep_size: "10GB"
      max_connections: "200"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"
      work_mem: "2MB"

  storage:
    size: "10Gi"
    storageClass: "ceph-block"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
