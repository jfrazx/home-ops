---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &app linkwarden-postgres
  namespace: documents
  labels:
    backup/database: "true"
    kustomize.toolkit.fluxcd.io/name: *app
    kustomize.toolkit.fluxcd.io/namespace: flux-system
  annotations:
    reloader.stakater.com/auto: "true"
    kustomize.toolkit.fluxcd.io/substitute: "true"

spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  bootstrap:
    initdb:
      database: linkwarden
      owner: linkwarden
      dataChecksums: true
      encoding: "UTF8"
      localeCType: "en_US.UTF-8"
      localeCollate: "en_US.UTF-8"

  # Wave 3 of the barman-cloud plugin migration (#1841). The in-tree
  # object-store stanza that stood here now lives in ./objectstore.yaml.
  # `target: prefer-standby` is dropped because that is already CNPG's default,
  # and retentionPolicy moves onto the ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: linkwarden-postgres-backup
        # serverName is the directory under the object store's destination
        # path, and the in-tree config has been writing to `linkwarden-postgres`
        # (confirmed against Backup.status.serverName). The ObjectStore is
        # named `linkwarden-postgres-backup`, a different string, so this is set
        # explicitly rather than relying on a default -- getting it wrong
        # starts a new catalog in a new prefix and silently orphans every
        # existing backup.
        serverName: linkwarden-postgres

  postgresql:
    parameters:
      max_slot_wal_keep_size: "10GB"
      max_connections: "200"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"
      work_mem: "2MB"

  storage:
    size: "10Gi"
    storageClass: "ceph-block"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
