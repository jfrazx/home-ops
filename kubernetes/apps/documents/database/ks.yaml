---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app documents-postgres
  namespace: flux-system
spec:
  targetNamespace: &namespace documents
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: cnpg-operator
      namespace: flux-system
    - name: democratic-csi
      namespace: storage
  path: ./kubernetes/apps/documents/database/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *namespace
      NAMESPACE: *namespace
      POSTGRES_VERSION: "18.1"
      POSTGRES_INSTANCES: "3"
      POSTGRES_STORAGE_SIZE: "20Gi"
      POSTGRES_MEMORY_LIMIT: "4Gi"
      POSTGRES_ENABLE_SUPERUSER: "true"
      POSTGRES_STORAGE_CLASS: truenas-iscsi
      POSTGRES_BACKUP_SCHEDULE: "0 45 2 * * *"
      # Raised from the 20 default now that paperless connects through the
      # pooler. This is a *per-instance* ceiling and there are two pooler
      # instances, so the real cost against the cluster's max_connections=100
      # is 2 x 35 = 70, leaving ~30 for CNPG's own internals (replication,
      # metrics exporter, superuser) plus apps that dial -rw directly.
      #
      # The inner quotes are load-bearing, not a typo. The component renders
      # this as an unquoted `max_db_connections: ${POOLER_MAX_DB_CONNECTIONS
      # :='20'}`, so Flux substitutes raw text into a field the Pooler CRD
      # types as string. The default only survives because `'20'` carries its
      # own quotes; a bare 35 lands as a YAML integer and the CRD rejects it,
      # which fails the dry-run gate and blocks this whole Kustomization --
      # Cluster and ObjectStore included, not just the Pooler.
      POOLER_MAX_DB_CONNECTIONS: "'35'"
