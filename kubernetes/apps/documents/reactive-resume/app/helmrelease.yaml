---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app reactive-resume
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false

  values:
    controllers:
      reactive-resume:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
              pullPolicy: IfNotPresent

            envFrom: &secret
              - secretRef:
                  name: reactive-resume-secret
            env:
              INIT_POSTGRES_SUPER_PASS:
                valueFrom:
                  secretKeyRef:
                    name: documents-postgres-superuser
                    key: password

        containers:
          app:
            image:
              repository: ghcr.io/amruthpillai/reactive-resume
              tag: v5.3.0@sha256:e05aefce8cab3d75913d63ee6d4dd1f5670bd1d2cdcbaeadf3757ae1eb79e499
              pullPolicy: IfNotPresent

            env:
              TZ: "${TIMEZONE}"
              APP_URL: "https://resume.${SECRET_DOMAIN}"

              # Storage. Reads are proxied by the app using authenticated
              # server-side GETs, so this endpoint is never browser-facing
              # and the bucket needs no anonymous-read grant.
              S3_ENDPOINT: "http://minio.storage.svc.cluster.local:9000"
              S3_BUCKET: reactive-resume-media
              S3_REGION: us-east-1
              S3_FORCE_PATH_STYLE: "true"

              # Mail. The in-cluster relay does not authenticate, so no
              # SMTP_USER / SMTP_PASS.
              SMTP_HOST: smtp-relay.network.svc.cluster.local
              SMTP_PORT: "25"
              SMTP_SECURE: "false"
              SMTP_FROM: "Reactive Resume <bot@${SECRET_DOMAIN}>"

              # Auth
              OAUTH_PROVIDER_NAME: Authentik
              OAUTH_DISCOVERY_URL: "https://auth.${SECRET_DOMAIN}/application/o/reactive-resume/.well-known/openid-configuration"
              FLAG_DISABLE_EMAIL_AUTH: "true"
              # Left false deliberately. Upstream does not document whether
              # this also blocks a first login arriving over OIDC, and the
              # Better Auth primitive underneath generally does. With email
              # auth off, Authentik's policy bindings already gate who can
              # get an account, so disabling signups buys nothing and risks
              # a day-one lockout with no local account to recover through.
              FLAG_DISABLE_SIGNUPS: "false"

            envFrom: *secret

            probes:
              # No probe uses /api/health. That route checks Postgres (SELECT 1)
              # and S3 (PutObject + DeleteObject of key `healthcheck`) under a
              # hardcoded 1500ms budget -- HEALTHCHECK_TIMEOUT_MS in
              # apps/server/src/http/health.ts, not configurable by env -- and
              # returns 503 if either check exceeds it. MinIO here is a single
              # node on an NFS PVC (truenas-nfs-minio), where a 2-byte PutObject
              # measures 1.5-2.2s, so the storage check times out on every poll
              # and the route is a permanent 503. Gating readiness on it kept the
              # pod NotReady forever even though the app served / in 7ms.
              #
              # Probing / instead is safe: the server runs Drizzle migrations to
              # completion before it opens the listener, so an answered request
              # means migrations finished and the DB was reachable. Dependency
              # health belongs in alerting, not in a probe that can hard-down the
              # app -- a killed container re-runs migrations and crash-loops with
              # kubelet backoff up to 5m, turning a 2m blip into 10m of downtime.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

        pod:
          annotations:
            k8s.ksgate.org/documents-postgres-ready: |
              {
                "apiVersion": "postgresql.cnpg.io/v1",
                "kind": "Cluster",
                "name": "documents-postgres",
                "namespace": "documents",
                "expression": "resource.status.readyInstances >= 1"
              }
          schedulingGates:
            - name: k8s.ksgate.org/documents-postgres-ready

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Reactive Resume
          gethomepage.dev/group: Documents
          gethomepage.dev/icon: reactive-resume.svg
          gethomepage.dev/description: >-
            Resume builder ·
            {{ if eq (index .Values.route.app.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
        hostnames:
          - "resume.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
