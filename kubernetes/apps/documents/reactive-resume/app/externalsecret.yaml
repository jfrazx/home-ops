---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret reactive-resume-secret
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: *secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ .auth_secret }}"

        OAUTH_CLIENT_ID: "{{ .oidc_client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .oidc_client_secret }}"

        S3_ACCESS_KEY_ID: "{{ .s3_access_key }}"
        S3_SECRET_ACCESS_KEY: "{{ .s3_secret_key }}"

        # NOTE: -rw, not the pooler. v5 runs Drizzle migrations (DDL) on every
        # startup and terminates if they fail; pgbouncer has already bitten
        # this repo once -- see the comment in household/vikunja.
        DATABASE_URL: "postgresql://reactive-resume:{{ .DB_PASSWORD | urlquery }}@documents-postgres-rw.documents.svc.cluster.local:5432/reactive-resume"

        # Postgres Init
        INIT_POSTGRES_HOST: documents-postgres-rw.documents.svc.cluster.local
        INIT_POSTGRES_DBNAME: reactive-resume
        INIT_POSTGRES_USER: reactive-resume
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD }}"

  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"

  data:
    - secretKey: auth_secret
      remoteRef:
        key: documents/reactive-resume/config
        property: auth_secret

    - secretKey: oidc_client_id
      remoteRef:
        key: documents/reactive-resume/oidc
        property: client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: documents/reactive-resume/oidc
        property: client_secret

    - secretKey: s3_access_key
      remoteRef:
        key: documents/reactive-resume/bucket
        property: access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: documents/reactive-resume/bucket
        property: secret_key
