---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret homepage-secret
  namespace: it
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: *secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Consumed by `{{HOMEPAGE_VAR_MEALIE_API_KEY}}` in mealie's route
        # annotations. Homepage substitutes HOMEPAGE_VAR_* into services
        # discovered from annotations, not just into config files.
        HOMEPAGE_VAR_MEALIE_API_KEY: "{{ .mealie_api_key }}"

  data:
    - secretKey: mealie_api_key
      remoteRef:
        key: household/mealie/homepage
        property: api_key
