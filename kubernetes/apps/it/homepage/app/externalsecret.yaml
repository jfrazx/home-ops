---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret homepage-secret
  namespace: it
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: *secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Consumed by `{{HOMEPAGE_VAR_MEALIE_API_KEY}}` in mealie's route
        # annotations. Homepage substitutes HOMEPAGE_VAR_* into services
        # discovered from annotations, not just into config files.
        HOMEPAGE_VAR_MEALIE_API_KEY: "{{ .mealie_api_key }}"

        # v2 native auth — unused while HOMEPAGE_AUTH_ENABLED is unset in
        # helmrelease.yaml. Populate the OpenBao keys below before flipping it on.
        HOMEPAGE_AUTH_SECRET: "{{ .homepage_auth_secret }}"
        HOMEPAGE_OIDC_CLIENT_ID: "{{ .homepage_oidc_client_id }}"
        HOMEPAGE_OIDC_CLIENT_SECRET: "{{ .homepage_oidc_client_secret }}"

  data:
    - secretKey: mealie_api_key
      remoteRef:
        key: household/mealie/homepage
        property: api_key

    - secretKey: homepage_auth_secret
      remoteRef:
        key: it/homepage/auth
        property: secret
    - secretKey: homepage_oidc_client_id
      remoteRef:
        key: it/homepage/oidc
        property: client_id
    - secretKey: homepage_oidc_client_secret
      remoteRef:
        key: it/homepage/oidc
        property: client_secret
