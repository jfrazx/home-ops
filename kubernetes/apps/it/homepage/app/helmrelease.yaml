---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    # Produces a ServiceAccount named exactly `homepage`, which is what the
    # ClusterRoleBinding in rbac.yaml targets. Do not rename one side alone.
    serviceAccount:
      homepage: {}

    controllers:
      homepage:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"

        serviceAccount:
          identifier: *app

        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.1.2@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60

            # Supplies HOMEPAGE_VAR_* widget keys referenced by discovered
            # route annotations. Add new widget keys to the ExternalSecret.
            envFrom:
              - secretRef:
                  name: homepage-secret

            env:
              TZ: "${TIMEZONE}"
              # Required. Without it Homepage serves a blank page.
              # Must match the route hostname below.
              HOMEPAGE_ALLOWED_HOSTS: "homepage.${SECRET_DOMAIN}"

              HOMEPAGE_AUTH_ENABLED: "true"
              HOMEPAGE_EXTERNAL_URL: "https://homepage.${SECRET_DOMAIN}"
              HOMEPAGE_OIDC_ISSUER: "https://auth.${SECRET_DOMAIN}/application/o/homepage/"
              HOMEPAGE_OIDC_NAME: "Authentik"

            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

        pod:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3000

    persistence:
      config:
        type: configMap
        name: homepage-configmap
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
            readOnly: true
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
            readOnly: true
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
          - path: /app/config/docker.yaml
            subPath: docker.yaml
            readOnly: true
          - path: /app/config/proxmox.yaml
            subPath: proxmox.yaml
            readOnly: true
          - path: /app/config/custom.css
            subPath: custom.css
            readOnly: true
          - path: /app/config/custom.js
            subPath: custom.js
            readOnly: true

      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs

      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    # Deliberately unannotated: Homepage should not list itself.
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
