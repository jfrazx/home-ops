---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./rbac.yaml
configMapGenerator:
  # All nine files Homepage considers "required" must be here. It copies any
  # missing one from its skeleton into /app/config at request time, which fails
  # on the read-only root filesystem and exits the process.
  - name: homepage-configmap
    files:
      - ./resources/settings.yaml
      - ./resources/kubernetes.yaml
      - ./resources/services.yaml
      - ./resources/widgets.yaml
      - ./resources/bookmarks.yaml
      - ./resources/docker.yaml
      - ./resources/proxmox.yaml
      - ./resources/custom.css
      - ./resources/custom.js
generatorOptions:
  disableNameSuffixHash: true
