---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: external-secrets
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: OpenBao
    gethomepage.dev/group: Services
    gethomepage.dev/icon: mdi-safe
    gethomepage.dev/description: Secrets management · LAN only
    kustomize.toolkit.fluxcd.io/substitute: "true"
spec:
  hostnames: ["openbao.${SECRET_DOMAIN}"]
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: openbao
          namespace: external-secrets
          port: 8200
          weight: 100
      matches:
        - path:
            type: PathPrefix
            value: /