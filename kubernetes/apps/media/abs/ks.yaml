---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app abs
spec:
  targetNamespace: &namespace media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # rook-ceph-cluster and volsync are in other namespaces, so they carry one.
  # A same-namespace dependsOn must omit the namespace field entirely.
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/media/abs/app
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CLAIM: abs-config
      VOLSYNC_CAPACITY: "30Gi"
      VOLSYNC_REPOSITORY_NAMESPACE: *namespace
      # 1001, not Audiobookshelf's usual 568. This one value sets both the
      # app's securityContext and the volsync mover's, and the mover has no
      # choice: the kopia repository is a single NFS directory shared by every
      # app in the cluster, mode 0700 owned by 1001, with no group or world
      # access. A 568 mover cannot even read /repository/.shards, so the
      # restore fails and the config PVC never populates. Every other active
      # ReplicationSource here runs as 1001.
      VOLSYNC_PUID: "1001"
      VOLSYNC_PGID: "1001"
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
