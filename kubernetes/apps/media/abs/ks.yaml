---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app abs
spec:
  targetNamespace: &namespace media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # rook-ceph-cluster and volsync are in other namespaces, so they carry one.
  # A same-namespace dependsOn must omit the namespace field entirely.
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/media/abs/app
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CLAIM: abs-config
      VOLSYNC_CAPACITY: "30Gi"
      VOLSYNC_REPOSITORY_NAMESPACE: *namespace
      VOLSYNC_PUID: "568"
      VOLSYNC_PGID: "568"
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
