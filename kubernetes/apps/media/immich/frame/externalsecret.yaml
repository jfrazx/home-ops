---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-frame-secret
  namespace: media
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: immich-frame-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Unprefixed on purpose: v1.0.37.0 matches environment variables
        # against property names on its settings class, so the key has to be
        # literally `ApiKey`. Only IMMICHFRAME_CONFIG_PATH is read under a
        # prefixed name.
        ApiKey: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: media/immich/api-keys
        property: frame
