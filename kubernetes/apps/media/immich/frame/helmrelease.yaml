---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-frame
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      immich-frame:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immichframe/immichframe
              tag: v1.0.37.0@sha256:edae2c0b9ab6e1384634582b2bab6246429e14bc209ff6ecc091fc9eedd4582c
            # ImmichFrame has no runtime settings UI in this release -- the
            # admin controller exists only on upstream main. Configuration is
            # read once at startup from Settings.json/Settings.yml in
            # IMMICHFRAME_CONFIG_PATH, and failing that from the environment,
            # where names must match its settings class exactly (unprefixed).
            # At least two must match or startup aborts with
            # "No environment variables found".
            env:
              TZ: ${TIMEZONE}
              IMMICHFRAME_CONFIG_PATH: /app/Config
              ImmichServerUrl: http://immich-server.media.svc.cluster.local:2283
              ApiKey:
                valueFrom:
                  secretKeyRef:
                    name: immich-frame-secret
                    key: ApiKey
              # Album, people and tag filters are set here too -- e.g.
              # Albums: "<uuid>,<uuid>" -- since nothing can set them later.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      # Empty in this release: nothing writes here, and downloaded images go
      # to ImageCache under the app root instead. Kept because a Settings.json
      # placed in this directory would be read in preference to every
      # environment variable above -- which is how file-based settings arrive
      # if we ever want them, and how they would silently win if one appeared
      # by accident.
      config:
        type: persistentVolumeClaim
        existingClaim: immich-frame
        globalMounts:
          - path: /app/Config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Immich Frame
          gethomepage.dev/group: Media
          gethomepage.dev/icon: immich.svg
          gethomepage.dev/description: >-
            Photo frame ·
            {{ if eq (index .Values.route.app.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
        hostnames: ["immich-frame.${SECRET_DOMAIN}"]
        parentRefs:
          # Upstream advises against public exposure: the frame view's only
          # protection is a single shared secret.
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
