---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-nfs-media
  resources:
    requests:
      storage: 1Ti
---
# Without a real volume here the CLIP models re-download on every pod start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 10Gi
