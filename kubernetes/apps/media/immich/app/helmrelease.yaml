---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    # Applied to every Immich component.
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # The chart's default tag lags Immich releases, so this must be
              # pinned and bumped alongside the chart version.
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
            env:
              TZ: ${TIMEZONE}
              REDIS_HOSTNAME: immich-valkey
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              # IMMICH_TELEMETRY_INCLUDE is NOT set here: the chart injects it
              # automatically whenever immich.metrics.enabled is true.
              # Generated by CloudNativePG at bootstrap -- never sourced from
              # OpenBao, which would be a second source of truth that cannot
              # match. See the note above this HelmRelease.
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app
                    key: uri

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  memory: 4Gi
      route:
        app:
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Immich
            gethomepage.dev/group: Media
            gethomepage.dev/icon: immich.svg
            gethomepage.dev/description: >-
              Photos ·
              {{ if eq (index .Values.server.route.app.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
          hostnames:
            - "immich.${SECRET_DOMAIN}"
          parentRefs:
            # Change to `external` to publish. See the spec's "Going external
            # later" section -- Cloudflare caps request bodies at 100MB and
            # Immich has no chunked upload.
            - name: internal
              namespace: kube-system
              sectionName: https
          rules:
            - backendRefs:
                - identifier: main
                  port: 2283

    machine-learning:
      enabled: true
      controllers:
        main:
          # immich-model-cache is RWO, so a rolling update deadlocks on
          # Multi-Attach whenever the new pod lands on another node.
          strategy: Recreate
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                # The -openvino suffix exists only on this image, not on
                # immich-server.
                tag: v3.1.0-openvino@sha256:4b6ef958e7749fc548377bb23ee219c09c74da8decee080d76dc6a388c39b013
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
              resources:
                requests:
                  gpu.intel.com/i915: 1
                  cpu: 100m
                  memory: 2Gi
                limits:
                  gpu.intel.com/i915: 1
                  memory: 8Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-model-cache
          globalMounts:
            - path: /cache

    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          size: 1Gi
          accessMode: ReadWriteOnce
          storageClass: ceph-block
