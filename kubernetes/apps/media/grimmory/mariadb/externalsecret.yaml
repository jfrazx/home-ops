---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret grimmory-database-secret
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: *secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Consumed by the MariaDB container. The official image only honours
        # these on FIRST init -- once the datadir exists they are ignored, so
        # a changed password here silently stops matching what the server has.
        MARIADB_ROOT_PASSWORD: "{{ .root_password }}"
        MARIADB_DATABASE: grimmory
        MARIADB_USER: grimmory
        MARIADB_PASSWORD: "{{ .password }}"

        # Consumed by Grimmory. Deliberately in the SAME secret so the app and
        # the server can never drift onto different passwords.
        #
        # These values are read from OpenBao rather than generated by the
        # ExternalSecrets Password generator on purpose. That generator emits a
        # NEW value on every refresh; elsewhere in this repo that is harmless
        # because postgres-init re-ALTERs the role on each pod start. MariaDB
        # has no such reconciler, so a generated password would rotate out from
        # under the server after 12h and lock Grimmory out with an auth error
        # that looks nothing like its cause.
        #
        # The connection parameters are spelled out because setting DATABASE_URL
        # replaces the application default wholesale, including the timezone
        # handling Grimmory's migrations expect.
        DATABASE_URL: >-
          jdbc:mariadb://grimmory-mariadb.media.svc.cluster.local:3306/grimmory?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
        DATABASE_USERNAME: grimmory
        DATABASE_PASSWORD: "{{ .password }}"

  data:
    - secretKey: root_password
      remoteRef:
        key: media/grimmory/database
        property: root_password
    - secretKey: password
      remoteRef:
        key: media/grimmory/database
        property: password
