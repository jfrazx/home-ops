---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &app authentik-database
  namespace: auth
  labels:
    backup/database: "true"
    kustomize.toolkit.fluxcd.io/name: *app
    kustomize.toolkit.fluxcd.io/namespace: flux-system
  annotations:
    reloader.stakater.com/auto: "true"
    kustomize.toolkit.fluxcd.io/substitute: "true"

spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-database-credentials
      dataChecksums: true
      encoding: "UTF8"
      localeCType: "en_US.UTF-8"
      localeCollate: "en_US.UTF-8"

  # Wave 3 of the barman-cloud plugin migration (#1841). The in-tree
  # object-store stanza that stood here now lives in ./objectstore.yaml.
  # `target: prefer-standby` is dropped because that is already CNPG's default,
  # and retentionPolicy moves onto the ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-database-backup
        # serverName is the directory under the object store's destination
        # path, and the in-tree config has been writing to `authentik-database`
        # (confirmed against Backup.status.serverName). The ObjectStore is
        # named `authentik-database-backup`, a different string, so this is set
        # explicitly rather than relying on a default -- getting it wrong
        # starts a new catalog in a new prefix and silently orphans every
        # existing backup.
        serverName: authentik-database

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      work_mem: "8MB"

      log_statement: "ddl"
      log_duration: "off"
      log_lock_waits: "on"
      log_min_duration_statement: "5000"

      random_page_cost: "1.1"
      effective_io_concurrency: "200"

      wal_level: "replica"
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_keep_size: "1GB"
      # authentik writes ~4.6 GB of WAL/day despite a ~214 MB database -- session
      # and token churn, not data volume. At 2GB the primary retained only ~10h
      # of WAL for a replication slot, so a standby that stalled longer had its
      # slot invalidated ("wal_removed") and could never resume streaming, while
      # CNPG still reported the cluster 3/3 healthy. 10GB (~2 days) matches
      # lldap/mealie/linkwarden and downloads-postgres.
      max_slot_wal_keep_size: "10GB"

  storage:
    size: "30Gi"
    storageClass: "ceph-block"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
