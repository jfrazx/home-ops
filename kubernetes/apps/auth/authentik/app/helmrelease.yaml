---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
  namespace: auth
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2026.8.0
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    global:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      volumes:
        - name: media-tmp
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      volumeMounts:
        - name: media-tmp
          mountPath: /media
        - name: tmp
          mountPath: /tmp
        - name: dev-shm
          mountPath: /dev/shm

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      podAnnotations:
        secret.reloader.stakater.com/reload: authentik-secret

      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      envFrom:
        - secretRef:
            name: authentik-secret

    authentik:
      postgresql:
        host: authentik-database-rw.auth.svc.cluster.local
        port: 5432
        name: *app
      error_reporting:
        enabled: false
      log_level: info

    server:
      replicas: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      pdb:
        enabled: true
        maxUnavailable: 1

      # gunicorn recycles workers periodically and a fresh worker takes ~1-2s to
      # boot; the chart default of timeoutSeconds 3 trips during that window.
      readinessProbe:
        httpGet:
          path: '{{ .Values.authentik.web.path }}-/health/ready/'
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 5
        successThreshold: 1
      livenessProbe:
        httpGet:
          path: '{{ .Values.authentik.web.path }}-/health/live/'
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 5
        successThreshold: 1

      containerSecurityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    worker:
      replicas: 3

      # The chart defaults all three worker probes to `exec: ak healthcheck`, and
      # /lifecycle/ak runs `python -m authentik.lib.config debugger` on every
      # invocation before it dispatches -- ~160ms of CPU to boot an interpreter and
      # read a debug flag that is always False here. The healthcheck it then execs
      # is a 16ms Rust binary that only GETs /-/health/live/ on 9000, so ~90% of
      # each probe was interpreter startup. Liveness and readiness both fire every
      # 10s, which made probes essentially this container's entire CPU usage.
      # Worse, ~250ms does not fit the 50ms of CFS quota a 500m limit allows per
      # 100ms period, so every probe was throttled across 4+ periods and
      # CPUThrottlingHigh sat at a flat 26% independent of load. The chart already
      # defaults the server's probes to httpGet and only the worker's to exec,
      # which is why server pods throttle at under 2% on an identical image and
      # limit. This just gives the worker the same treatment: same endpoint the
      # Rust healthcheck was calling anyway, without the interpreter in front.
      livenessProbe: &workerProbe
        # Helm deep-merges values, so the chart's default `exec` survives unless it
        # is explicitly nulled -- and a probe carrying both handlers is rejected.
        exec: null
        httpGet:
          path: /-/health/live/
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
        successThreshold: 1
      # Kept on /-/health/live/ rather than /-/health/ready/ to preserve exactly
      # what `ak healthcheck` probed; this change is about the cost of the probe,
      # not its meaning.
      readinessProbe: *workerProbe
      startupProbe:
        exec: null
        httpGet:
          path: /-/health/live/
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 60
        successThreshold: 1

      containerSecurityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    prometheus:
      rules:
        enabled: true
