# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app adventurelog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false

  values:
    controllers:
      adventurelog:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
              pullPolicy: IfNotPresent

            envFrom: &secret
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            env:
              INIT_POSTGRES_SUPER_PASS:
                valueFrom:
                  secretKeyRef:
                    name: household-postgres-superuser
                    key: password

        containers:
          frontend:
            image:
              repository: ghcr.io/seanmorley15/adventurelog-frontend
              tag: latest@sha256:51ee22428b4192f4372b54f84c8b90cd710311ad99993c5045f53b51717dd3f7

            env:
              PUBLIC_SERVER_URL: "https://{{ .Release.Name }}-backend.${SECRET_DOMAIN}"
              ORIGIN: "http://localhost:3000"
              BODY_SIZE_LIMIT: Infinity

            probes:
              liveness: &probes
                enabled: false
              readiness: *probes
              startup: *probes
            resources:
              requests:
                cpu: 50m
                memory: 100Mi

          server:
            image:
              repository: ghcr.io/seanmorley15/adventurelog-backend
              tag: latest@sha256:418e82260939d70783f76dc0a10b7a1c32362dad5663b561dbad6a27dd4a6a7d

            env:
              PUBLIC_URL: https://{{ .Release.Name }}-backend.${SECRET_DOMAIN}
              FRONTEND_URL: https://adventure.${SECRET_DOMAIN}
              CSRF_TRUSTED_ORIGINS: https://{{ .Release.Name }}-backend.${SECRET_DOMAIN},https://adventure.${SECRET_DOMAIN}
              DEBUG: "false"
            envFrom: *secret

            probes:
              liveness: &probes
                enabled: false
              readiness: *probes
              startup: *probes

            resources:
              requests:
                cpu: 125m
                memory: 500Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &frontendPort 3000
          base:
            port: &serverPort 8000

    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /code/media

    route:
      frontend:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: AdventureLog
          gethomepage.dev/group: Home
          gethomepage.dev/icon: adventurelog.svg
          gethomepage.dev/description: >-
            Travel journal ·
            {{ if eq (index .Values.route.frontend.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: &httpAccess external
            namespace: kube-system
            sectionName: https
        hostnames:
          - "adventure.${SECRET_DOMAIN}"
        rules:
          - backendRefs:
              - name: *app
                port: *frontendPort
            matches:
              - path:
                  type: PathPrefix
                  value: /

      server:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: *httpAccess
            namespace: kube-system
            sectionName: https
        hostnames:
          - "{{ .Release.Name }}-backend.${SECRET_DOMAIN}"
        rules:
          - backendRefs:
              - name: *app
                port: *serverPort
            matches:
              - path:
                  type: PathPrefix
                  value: /
