---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret bge-test-secret
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: *secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # App
        BETTER_AUTH_SECRET: "{{ .better_auth_secret }}"
        DATA_ENCRYPTION_KEY: "{{ .data_encryption_key }}"
        VALKEY_PASSWORD: &valkeypass "{{ .valkey_password }}"
        REDIS_PASSWORD: *valkeypass

        # Postgres. Every role connects through the pooler (session mode, which
        # the bootstrap advisory lock needs); only the api's migrations go
        # direct. db_password is a fixed OpenBao value rather than the Password
        # generator, which would rotate it under every role every refresh.
        DATABASE_URL: "postgresql://bge_test:{{ .db_password }}@household-postgres-pooler.household.svc.cluster.local:5432/bge_test"
        DATABASE_MIGRATION_URL: "postgresql://bge_test:{{ .db_password }}@household-postgres-rw.household.svc.cluster.local:5432/bge_test"

        # DataGateways
        IGDB_CLIENT_ID: "{{ .igdb_client_id }}"
        IGDB_CLIENT_SECRET: "{{ .igdb_client_secret }}"
        BOARDGAMEGEEK_API_KEY: "{{ .bgg_api_key }}"

        # Postgres Init
        INIT_POSTGRES_HOST: household-postgres-rw.household.svc.cluster.local
        INIT_POSTGRES_DBNAME: bge_test
        INIT_POSTGRES_USER: bge_test
        INIT_POSTGRES_PASS: "{{ .db_password }}"

  data:
    - secretKey: better_auth_secret
      remoteRef:
        key: household/bge-test/config
        property: better_auth_secret
    - secretKey: data_encryption_key
      remoteRef:
        key: household/bge-test/config
        property: data_encryption_key
    - secretKey: valkey_password
      remoteRef:
        key: household/bge-test/config
        property: valkey_password
    - secretKey: db_password
      remoteRef:
        key: household/bge-test/config
        property: db_password

    - secretKey: igdb_client_id
      remoteRef:
        key: household/bge-test/igdb
        property: client_id
    - secretKey: igdb_client_secret
      remoteRef:
        key: household/bge-test/igdb
        property: client_secret

    - secretKey: bgg_api_key
      remoteRef:
        key: household/bge-test/boardgamegeek
        property: api_key
