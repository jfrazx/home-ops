---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cross-seed
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      cross-seed:
        annotations:
          secret.reloader.stakater.com/reload: cross-seed-secret

        pod:
          annotations:
            k8s.ksgate.org/qbittorrent-deployment: |-
              {
                "apiVersion": "apps/v1",
                "kind": "Deployment",
                "name": "qbittorrent",
                "namespace": "downloaders",
                "expression": "resource.status.readyReplicas >= 1"
              }
            k8s.ksgate.org/prowlarr-deployment: |-
              {
                "apiVersion": "apps/v1",
                "kind": "Deployment",
                "name": "prowlarr",
                "namespace": "downloads",
                "expression": "resource.status.readyReplicas >= 1"
              }

          schedulingGates:
            - name: k8s.ksgate.org/qbittorrent-deployment
            - name: k8s.ksgate.org/prowlarr-deployment

          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001

        containers:
          app:
            image:
              repository: ghcr.io/cross-seed/cross-seed
              tag: 6.13.7@sha256:a1fed512261fd968c55cb03c51cff9c6620aa76a34b3b591afca95c890aa8225

            args:
              - daemon
              - -v

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1536Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: 2468

    persistence:
      config:
        existingClaim: *app

      # cross-seed writes verbose.<date>.log unconditionally at level "silly"
      # (dist/logger.js builds that transport whether or not -v is passed; the
      # flag only raises the console level), which at this library size is
      # ~1GB a day, and it prunes purely by age -- maxFiles: "14d", no size cap.
      # A fortnight of that does not fit the 5Gi config claim: it filled on
      # 2026-08-14 and every start since died on ENOSPC in the first log write,
      # before a single torrent was read. Off ceph because this is throwaway
      # data and ceph is the scarcer pool, and off the config claim so volsync
      # keeps snapshotting the 12MB database instead of two weeks of logs.
      logs:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 30Gi
        storageClass: truenas-iscsi
        # config uses existingClaim, so this is the only claim the chart
        # generates, and app-template appends the identifier only when it
        # generates more than one. Without the suffix it renders as plain
        # "cross-seed" and Helm tries to overwrite the volsync-managed claim.
        suffix: logs
        globalMounts:
          - path: /config/logs

      config-file:
        type: secret
        name: cross-seed-secret
        globalMounts:
          - path: /config/config.js
            subPath: config.js

      media:
        type: nfs
        path: "/mnt/${SECRET_NFS_SHARE}/media"
        server: "${SECRET_NFS_SERVER}"
        advancedMounts:
          cross-seed:
            app:
              - path: /data/media
