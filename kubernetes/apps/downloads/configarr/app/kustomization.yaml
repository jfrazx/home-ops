---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: configarr-configmap
    files:
      - ./resources/config.yml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Custom format regexes may contain ${...}-like sequences; keep Flux
    # postBuild substitution away from this ConfigMap.
    kustomize.toolkit.fluxcd.io/substitute: disabled
