---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-cluster-alerts
  namespace: database
spec:
  groups:
    - name: cnpg.cluster.rules
      interval: 30s
      rules:
        # Cluster Health
        - alert: CNPGClusterDown
          expr: |
            cnpg_pg_replication_in_recovery >= 1 and cnpg_pg_replication_slots_active == 0
          for: 5m
          annotations:
            summary: "CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} has no active instances (replication expected)"
            description: "PostgreSQL cluster {{ $labels.namespace }}/{{ $labels.cluster }} has been down for 5 minutes (replication expected)"
          labels:
            severity: critical

        - alert: CNPGReplicationLag
          expr: |
            cnpg_pg_replication_lag_seconds > 300
          for: 5m
          annotations:
            summary: "CNPG replication lag on {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: "Replication lag is {{ $value }}s on {{ $labels.namespace }}/{{ $labels.cluster }}"
          labels:
            severity: warning

        - alert: CNPGReplicationBroken
          expr: |
            cnpg_pg_replication_in_recovery == 0 and cnpg_pg_replication_slots_active == 0
          for: 5m
          annotations:
            summary: "CNPG replication broken on {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: "Cluster {{ $labels.namespace }}/{{ $labels.cluster }} has no active replication"
          labels:
            severity: critical

        # Connection Limits
        - alert: CNPGHighConnectionUsage
          expr: |
            (cnpg_pg_stat_database_numbackends / cnpg_pg_settings_max_connections) * 100 > 80
          for: 5m
          annotations:
            summary: "High connection usage on {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: "Connection usage is {{ $value }}% on database {{ $labels.datname }}"
          labels:
            severity: warning

        - alert: CNPGConnectionLimit
          expr: |
            (cnpg_pg_stat_database_numbackends / cnpg_pg_settings_max_connections) * 100 > 95
          for: 2m
          annotations:
            summary: "Connection limit approaching on {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: "Connection usage is {{ $value }}% on database {{ $labels.datname }}"
          labels:
            severity: critical

        # Storage
        - alert: CNPGHighDiskUsage
          expr: |
            (cnpg_pg_database_size_bytes / cnpg_pg_tablespace_size_bytes) * 100 > 80
          for: 5m
          annotations:
            summary: "High disk usage on {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: "Disk usage is {{ $value }}% on {{ $labels.namespace }}/{{ $labels.cluster }}"
          labels:
            severity: warning

        # failed_count is a lifetime counter that is never reset, so comparing
        # it against zero pins this alert on forever after a single historical
        # failure (typically a .history file at a failover). Compare the
        # timestamps instead: this fires only while archiving is *currently*
        # stuck, and clears as soon as any WAL archives successfully.
        - alert: CNPGWALArchiveFailing
          expr: |
            cnpg_pg_stat_archiver_last_failed_time
              > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          annotations:
            summary: "WAL archiving is stuck on {{ $labels.job }}"
            description: "The most recent archive attempt on {{ $labels.pod }} failed and no WAL has archived since."
          labels:
            severity: warning

        # Backup Status
        #
        # Two metric families report backup state, and both have to be read.
        # `cnpg_collector_*` comes from the operator, which only ever records
        # backups taken through the in-tree barmanObjectStore path. Once a
        # cluster moves to the barman-cloud plugin (#1841) the operator stops
        # updating them -- and they freeze at the last in-tree value rather than
        # going absent or stale, so a plugin cluster whose backups are perfectly
        # healthy reads as hours or days behind. The plugin publishes its own
        # `barman_cloud_cloudnative_pg_io_*` family on the same instance metrics
        # endpoint (port 9187, no extra ServiceMonitor), and that one is live.
        #
        # Selecting both families by __name__ and taking max means whichever one
        # is actually being updated wins, so these alerts read correctly before,
        # during and after the migration with no per-cluster bookkeeping.
        #
        # Replicas report 0 for the collector timestamps, so every expression
        # aggregates with max by (namespace, job) to pick up the primary's real
        # value. The plugin family reports the same value on every instance,
        # which max leaves untouched.
        - alert: CNPGBackupFailed
          expr: |
            max by (namespace, job) ({__name__=~"(cnpg_collector|barman_cloud_cloudnative_pg_io)_last_failed_backup_timestamp"})
              > max by (namespace, job) ({__name__=~"(cnpg_collector|barman_cloud_cloudnative_pg_io)_last_available_backup_timestamp"})
          for: 5m
          annotations:
            summary: "CNPG backup failed on {{ $labels.job }}"
            description: "The last backup attempt failed and is newer than the last successful backup."
          labels:
            severity: critical

        - alert: CNPGBackupStale
          expr: |
            (time() - max by (namespace, job) ({__name__=~"(cnpg_collector|barman_cloud_cloudnative_pg_io)_last_available_backup_timestamp"} > 0)) > 86400
          for: 1h
          annotations:
            summary: "CNPG backup is stale on {{ $labels.job }}"
            description: "Last successful backup was {{ $value | humanizeDuration }} ago"
          labels:
            severity: warning

        # Catches a cluster that has never produced a backup at all. CNPG sets
        # archive_mode=on with its own archive_command regardless of whether an
        # object store is configured, and that command succeeds as a no-op when
        # there is none - so an unconfigured cluster looks healthy and reports
        # ContinuousArchiving=True while storing nothing. CNPGBackupStale cannot
        # catch this because the timestamp is 0 rather than merely old.
        - alert: CNPGBackupNotConfigured
          expr: |
            max by (namespace, job) ({__name__=~"(cnpg_collector|barman_cloud_cloudnative_pg_io)_last_available_backup_timestamp"}) == 0
          for: 1h
          annotations:
            summary: "CNPG cluster {{ $labels.job }} has never been backed up"
            description: "No successful backup has ever been recorded. Check that an ObjectStore plus spec.plugins[barman-cloud] (or, pre-migration, spec.backup.barmanObjectStore) and a ScheduledBackup all exist."
          labels:
            severity: critical

        # Performance
        - alert: CNPGSlowQueries
          expr: |
            rate(cnpg_pg_stat_database_tup_returned[5m]) > 10000 and
            rate(cnpg_pg_stat_database_tup_fetched[5m]) / rate(cnpg_pg_stat_database_tup_returned[5m]) < 0.1
          for: 10m
          annotations:
            summary: "Slow queries detected on {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: "Low fetch/return ratio on database {{ $labels.datname }}"
          labels:
            severity: warning

        # The three rules below read CNPG's default pg_stat_activity query.
        # cnpg_backends_max_tx_duration_seconds is the age of the oldest open
        # *transaction* per (datname, usename, application_name, state) -- for
        # state="active" that is effectively the longest-running query.
        # application_name is left out of the grouping on purpose: clients like
        # seerr put their ip:port in it, so every reconnect would mint a new
        # alert identity. Replicas are included; max collapses the pod label.
        # Thresholds sit above the 14-day baseline (2026-09): normal active
        # peaks stay under 5m, lock waits are rare and brief.
        - alert: CNPGLongRunningQuery
          expr: |
            max by (namespace, job, datname, usename) (
              cnpg_backends_max_tx_duration_seconds{state="active"}
            ) > 300
          for: 5m
          annotations:
            summary: "Long-running query on {{ $labels.job }}"
            description: "A query by {{ $labels.usename }} on database {{ $labels.datname }} has been running for {{ $value | humanizeDuration }}."
          labels:
            severity: warning

        # An open transaction doing nothing still holds its locks and pins the
        # xmin horizon, so autovacuum can't reclaim dead rows behind it.
        - alert: CNPGIdleInTransaction
          expr: |
            max by (namespace, job, datname, usename) (
              cnpg_backends_max_tx_duration_seconds{state=~"idle in transaction.*"}
            ) > 600
          for: 5m
          annotations:
            summary: "Transaction left open on {{ $labels.job }}"
            description: "A connection by {{ $labels.usename }} on database {{ $labels.datname }} has been idle inside an open transaction for {{ $value | humanizeDuration }}. It holds locks and blocks vacuum."
          labels:
            severity: warning

        - alert: CNPGBackendsWaitingOnLocks
          expr: |
            max by (namespace, job) (cnpg_backends_waiting_total) > 0
          for: 5m
          annotations:
            summary: "Queries blocked on locks on {{ $labels.job }}"
            description: "{{ $value }} backend(s) have been waiting on a lock for 5+ minutes. Check pg_locks / pg_blocking_pids() for the holder."
          labels:
            severity: warning

        - alert: CNPGDeadlocks
          expr: |
            rate(cnpg_pg_stat_database_deadlocks[5m]) > 0
          for: 5m
          annotations:
            summary: "Deadlocks detected on {{ $labels.namespace }}/{{ $labels.cluster }}"
            description: "{{ $value }} deadlocks/sec on database {{ $labels.datname }}"
          labels:
            severity: warning

    - name: cnpg.pooler.rules
      interval: 30s
      rules:
        # PgBouncer Health
        - alert: PgBouncerDown
          expr: |
            up{job="pgbouncer-metrics"} == 0
          for: 5m
          annotations:
            summary: "PgBouncer is down in {{ $labels.namespace }}"
            description: "PgBouncer instance {{ $labels.pod }} is not responding"
          labels:
            severity: critical

        # Connection Pool Saturation
        - alert: PgBouncerPoolSaturation
          expr: |
            (pgbouncer_pools_server_active / pgbouncer_pools_max_connections) * 100 > 80
          for: 5m
          annotations:
            summary: "PgBouncer pool saturation in {{ $labels.namespace }}"
            description: "Pool {{ $labels.database }} is {{ $value }}% saturated"
          labels:
            severity: warning

        - alert: PgBouncerPoolExhaustion
          expr: |
            (pgbouncer_pools_server_active / pgbouncer_pools_max_connections) * 100 > 95
          for: 2m
          annotations:
            summary: "PgBouncer pool exhaustion in {{ $labels.namespace }}"
            description: "Pool {{ $labels.database }} is {{ $value }}% full"
          labels:
            severity: critical

        # Pooler vs Cluster Connection Coordination Alert
        - alert: PgBouncerExceedingPostgresLimit
          expr: |
            pgbouncer_pools_max_connections
            > on(namespace) group_left
            cnpg_pg_settings_max_connections * 0.85
          for: 5m
          annotations:
            summary: "PgBouncer pool limits exceed PostgreSQL capacity"
            description: "Pool configured for {{ $value }} connections but PostgreSQL max is lower"
          labels:
            severity: warning

        # Client Wait Time
        - alert: PgBouncerHighWaitTime
          expr: |
            pgbouncer_stats_avg_wait_time > 1
          for: 5m
          annotations:
            summary: "High client wait time in {{ $labels.namespace }}"
            description: "Average wait time is {{ $value }}s for database {{ $labels.database }}"
          labels:
            severity: warning

        # Queue Buildup
        - alert: PgBouncerQueueBacklog
          expr: |
            pgbouncer_pools_client_waiting > 10
          for: 5m
          annotations:
            summary: "PgBouncer queue backlog in {{ $labels.namespace }}"
            description: "{{ $value }} clients waiting for connections to {{ $labels.database }}"
          labels:
            severity: warning
