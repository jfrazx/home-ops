---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # The chart's fullname helper only collapses the prefix when the release
  # name already contains the chart name, so releasing as `barman-cloud`
  # would name every object `barman-cloud-plugin-barman-cloud`. The Service
  # is pinned to `barman-cloud` by the chart either way -- that name is what
  # generates the TLS certificate and cannot be configured.
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      create: true
    serviceAccount:
      create: true
    rbac:
      create: true
