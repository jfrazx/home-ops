---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: influxdb-credentials
  namespace: database
spec:
  secretStoreRef:
    name: openbao-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: influxdb-auth
    creationPolicy: Owner
    template:
      type: Opaque
      # Key names are the influxdb2 chart's adminUser.existingSecret contract.
      # They only seed the first start on an empty volume; changing them later
      # does not rotate anything in a running InfluxDB.
      data:
        admin-password: "{{ .admin_password }}"
        admin-token: "{{ .admin_token }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: database/influxdb/admin
        property: password
    - secretKey: admin_token
      remoteRef:
        key: database/influxdb/setup
        property: admin_token
