---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.34.0
      sourceRef:
        kind: HelmRepository
        name: trivy-charts
        namespace: flux-system
  driftDetection:
    mode: enabled
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    excludeNamespaces: "kube-system"

    # Reports live as JSON files on NFS instead of CRDs in etcd.
    # 1384 SBOMReports (~200Mi, up to 1.4Mi each) rewritten every
    # scannerReportTTL were fragmenting etcd down to a ~42% in-use ratio.
    # runAsUser/fsGroup match the truenas-nfs dataset (0770 1001:1001).
    alternateReportStorage:
      enabled: true
      storageClassName: truenas-nfs
      storage: 10Gi
      mountPath: /mnt/data/trivy-operator
      volumeName: trivy-operator-pvc
      podSecurityContext:
        runAsUser: 1001
        fsGroup: 1001
    podAnnotations:
      k8tz.io/inject: "false"

    operator:
      replicas: 1
      scanJobsConcurrentLimit: 3
      scanJobTTL: 10s
      builtInTrivyServer: true
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      annotations:
        reloader.stakater.com/auto: "true"
      webhookBroadcastURL: ${TRIVY_WEBHOOK_URL}

    trivy:
      slow: true # flag is to use less CPU/memory for scanning though it takes more time than normal scanning
      ignoreUnfixed: true
      mode: ClientServer
      severity: HIGH,CRITICAL
      storageClassEnabled: false # ephemeral storage
      resources:
        limits:
          cpu: 500m
          memory: 1Gi

    trivyOperator:
      excludeImages: "quay.io/backube/*"
      skipResourceByLabels: "app.kubernetes.io/created-by=volsync"
    # https://github.com/aquasecurity/trivy-operator/issues/2566
    nodeCollector:
      useNodeSelector: false
      excludeNodes: kubernetes.io/os=linux
    serviceMonitor:
      enabled: true
