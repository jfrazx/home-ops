---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrutiny
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: scrutiny-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Scrutiny creates its own buckets and downsampling tasks on first
        # start, so it needs an all-access token; the InfluxDB setup token is
        # the only one that exists today.
        SCRUTINY_WEB_INFLUXDB_TOKEN: "{{ .admin_token }}"
  data:
    - secretKey: admin_token
      remoteRef:
        key: database/influxdb/setup
        property: admin_token
