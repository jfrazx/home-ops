---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-webhook-secret
  namespace: observability
spec:
  secretStoreRef:
    name: openbao-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: alertmanager-webhook-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        webhook-url: "{{ .webhook_url }}"
  data:
    - secretKey: webhook_url
      remoteRef:
        key: shared/notifications/discord
        property: url
---
# healthchecks.io ping URL for the Watchdog heartbeat receiver. Alertmanager pods
# cannot start without this secret, so the OpenBao key must exist before this
# deploys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-heartbeat-secret
  namespace: observability
spec:
  secretStoreRef:
    name: openbao-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: alertmanager-heartbeat-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "{{ .url }}"
  data:
    - secretKey: url
      remoteRef:
        key: shared/notifications/healthchecks
        property: url
