---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-wedge-rules
  annotations:
    # REQUIRED, not defensive. This app's Kustomization declares a postBuild
    # (see ../ks.yaml), so envsubst runs over every file here. Without this the
    # `$labels.*` references below are read as shell variables and blanked out,
    # leaving alerts that fire with empty summaries.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  groups:
    - name: node-wedge.rules
      rules:
        # Why this exists: kube-prometheus-stack already ships KubeNodeNotReady,
        # KubeNodeUnreachable and KubeletInstanceUnreachable, and on 2026-09-10
        # all three sat in *pending* for the entire outage and never fired. Each
        # carries `for: 15m`; the node was gone for 14m44s. Nothing was
        # delivered. The three prior wedges were the same shape.
        #
        # Enabling the hardware watchdog (talos/patches/global/machine-watchdog.yaml)
        # makes that permanently worse rather than better: the node now resets
        # itself at 5m and is back in ~7m, so a 15m `for` can no longer be
        # reached by any wedge. Without this rule the failure mode becomes
        # completely silent.
        #
        # KubeletDown is not a substitute either -- its expression compares
        # node count against kubelet count with `unless on (cluster)`, so it
        # only fires when *every* kubelet in the cluster is down.
        - alert: NodeWedged
          annotations:
            summary: |
              Node {{ $labels.node }} stopped answering scrapes and is likely
              hard-locked. The hardware watchdog resets it ~5m after the wedge
              begins, so expect an automatic recovery shortly;
              NodeRebootedUnexpectedly will confirm it.
            description: |
              Four wedges on the same worker in 31 days, none of them panics:
              `kernel.panic = 10` is set, so a panic or oops would self-reboot
              in 10s. The node instead goes silent to ICMP and stays down.
              If the watchdog does not recover it within ~7m, power cycle it.
              Post mortem: docs/incidents/2026-09-10-worker-02-wedge.md
          # metrics_path is pinned because the kubelet job is scraped three
          # times per node (/metrics, /metrics/cadvisor, /metrics/probes).
          # Without it a single wedge raises three identical alerts.
          #
          # Deliberately keyed on kubelet alone rather than AND-ed with
          # node-exporter being down too. The join would cut false positives
          # (a kubelet restart during a Talos upgrade can trip this), but it
          # would also mean a broken node-exporter silently disables the alert.
          # For a wedge -- where everything on the node stops at once -- a
          # slightly noisy alert that always fires beats a precise one that can
          # fail quietly.
          expr: up{job="kubelet", metrics_path="/metrics"} == 0
          # Scrape interval is 30s, so `up` flips within ~5s of the node going
          # silent (measured: node died 18:13:55, up=0 at 18:14:00). 2m puts
          # delivery ~3 minutes ahead of the watchdog reset, which is enough to
          # look at the node while it is still wedged if you want the forensics.
          for: 2m
          labels:
            severity: critical

        # The other half: after the watchdog rollout a wedge is self-healing, so
        # NodeWedged resolves on its own and is easy to miss. These two are the
        # durable record that a node went down and came back -- and the only
        # signal that the watchdog actually did its job.
        #
        # Every boot raises exactly one of the pair. A boot counts as planned
        # when, in the 40m before it (30m of run-up plus the 10m the alert stays
        # live), the node was cordoned or ran a system-upgrade Job. Each wedge
        # reset 09-11 -> 09-30 fails both tests; the 10-01 BIOS maintenance,
        # which was drained first, passes. A single `NodeRebooted` used to cover
        # both cases, so a crash read exactly like maintenance and got buried in
        # the burst of pod alerts every node bounce sends.
        #
        # `talosctl shutdown` and `kubectl drain` cordon first. `talosctl
        # reboot` does NOT unless given --drain (v1.13), so a bare reboot pages
        # as unexpected. That is the intended failure direction: a node that is
        # down without explanation should page; a planned one costs one extra
        # message. The upgrade half is untested -- no Talos upgrade has run since
        # this rule was written -- so if an upgrade pages, look here first.
        #
        # If kube-state-metrics is down, the `unless` side is empty and every
        # boot pages as unexpected. Same reasoning: fail loud.
        #
        # instance on node_boot_time_seconds is the node name; endpoint is
        # pinned because three of the four nodes are also scraped via a second
        # target labelled instance="<ip>:9100", which would double every alert.
        - alert: NodeRebootedUnexpectedly
          annotations:
            summary: |
              Node {{ $labels.instance }} booted {{ $value | humanizeDuration }}
              ago without being cordoned or upgraded first -- a crash, a
              watchdog reset, or a power loss.
            description: |
              Check for a CPU fault left over from before the reset:
              `talosctl -n <ip> dmesg | grep -iE 'machine check|hardware error'`.
              A warm (watchdog) reset preserves the MCA banks, so the record
              prints on the next boot; a cold power cycle erases it. The run-up
              to the reset survives only in VictoriaLogs (query the node's
              last lines before "Kernel command line"). worker-02 has a known
              E-core L2 fault; BIOS CRARL579.0032 on 2026-10-01 is the fix
              under test, so a reset there now is grounds for an RMA.
          expr: |
            (time() - node_boot_time_seconds{endpoint="http-metrics"}) < 600
            unless on (instance)
            label_replace(
              max by (node) (max_over_time(kube_node_spec_unschedulable[40m])) == 1
              or
              max by (node) (max_over_time(kube_pod_info{namespace="system-upgrade", created_by_kind="Job"}[40m])),
              "instance", "$1", "node", "(.+)"
            )
          for: 0m
          labels:
            severity: critical

        - alert: NodeRebooted
          annotations:
            summary: |
              Node {{ $labels.instance }} finished a planned reboot
              (uptime is now {{ $value | humanizeDuration }}).
            description: |
              The node was cordoned or ran a system-upgrade Job before it went
              down, so this is maintenance or an upgrade completing. Confirm it
              was uncordoned and Ceph is back to active+clean.
          # The exact complement of NodeRebootedUnexpectedly -- keep the two
          # selectors identical, or a boot can raise both alerts or neither.
          expr: |
            (time() - node_boot_time_seconds{endpoint="http-metrics"}) < 600
            and on (instance)
            label_replace(
              max by (node) (max_over_time(kube_node_spec_unschedulable[40m])) == 1
              or
              max by (node) (max_over_time(kube_pod_info{namespace="system-upgrade", created_by_kind="Job"}[40m])),
              "instance", "$1", "node", "(.+)"
            )
          for: 0m
          labels:
            severity: warning
