---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ./externalsecret.yaml is intentionally NOT applied in phase 1. It provisions
  # Pushover and healthchecks.io credentials for this chart's Alertmanager, which
  # is disabled while kube-prometheus-stack keeps ownership of notifications --
  # and its `/healthchecks` path is not read by any live ExternalSecret today, so
  # applying it now would most likely just fail. Add it back at cutover, if the
  # ported receiver still needs it.
  - ./helmrelease.yaml
