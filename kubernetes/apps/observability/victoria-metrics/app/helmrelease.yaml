---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# https://raw.githubusercontent.com/VictoriaMetrics/helm-charts/refs/heads/master/charts/victoria-metrics-k8s-stack/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    # The OCIRepository is named `victoria-metrics` (it just happens to point at
    # the victoria-metrics-k8s-stack chart), and it lives in flux-system while
    # this release targets observability -- so the namespace is required. Both
    # were wrong, which is one reason this app has never deployed.
    name: victoria-metrics
    namespace: flux-system
  interval: 1h
  # After 0.61.0, I've been getting new alerts firing so I'm patching for now
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: VMRule
              name: stack-k8s.rules.containermemoryswap
            patch: |-
              - op: replace
                path: /spec/groups/0/rules/0/expr
                value: 'container_memory_swap{job="kubelet",metrics_path="/metrics/cadvisor",image!=""} * on(cluster,namespace,pod) group_left(node) topk(1,max(kube_pod_info{node!=""}) by(cluster,namespace,pod,node)) by(cluster,namespace,pod) or vector(0)'
          - target:
              kind: VMRule
              name: stack-kube-prometheus-general.rules
            patch: |-
              - op: replace
                path: /spec/groups/0/rules/1/expr
                value: "count(up == 0) without(instance,pod,node) OR on() vector(0)"

  values:
    # ------------------------------------------------------------------------
    # PHASE 1 of 2 -- running alongside kube-prometheus-stack for parity checking.
    #
    # In this phase VictoriaMetrics only *collects*. It does not alert and it does
    # not own any component that kube-prometheus-stack already runs. vmagent
    # scrapes from the VMServiceScrape/VMRule objects the operator converts out of
    # the existing 41 ServiceMonitors, 12 PodMonitors and 43 PrometheusRules, and
    # writes to vmsingle. Grafana gets VictoriaMetrics as a second, non-default
    # datasource so dashboards can be compared side by side.
    #
    # Expect ~2x scrape load while both stacks run. That is the cost of the
    # phased cutover.
    #
    # AT CUTOVER (phase 2), flip every "phase 1" marker below and remove
    # kube-prometheus-stack. Note that `enable_converter_ownership: true` makes
    # converted objects garbage-collect with their source, so kube-prometheus-
    # stack's own converted rules disappear when it does -- which is why
    # defaultRules and the built-in scrape targets must be turned back ON in the
    # same change.
    # ------------------------------------------------------------------------
    fullnameOverride: stack
    victoria-metrics-operator:
      env:
        - name: VM_VMALERTDEFAULT_CONFIGRELOADERCPU
          value: 0
        - name: VM_VMAGENTDEFAULT_CONFIGRELOADERCPU
          value: 0
        - name: VM_VMALERTMANAGER_CONFIGRELOADERCPU
          value: 0
      operator:
        enable_converter_ownership: true # Required to allow VM to remove VM rules it imports if a prometheus rule is deleted
        useCustomConfigReloader: true # Bundled config-reloader, should reduce vmagent and vmauth config sync-time and make it predictable.

    defaultDashboards:
      enabled: false

    defaultRules:
      # phase 1: OFF. kube-prometheus-stack's 43 PrometheusRules are already
      # converted to VMRules by the operator, so creating these too would define
      # every alert twice. Turn back ON at cutover, when the converted copies
      # disappear along with kube-prometheus-stack.
      create: false
      # Added to not consider 304 redirects as errors/warnings
      groups:
        kubeApiserverSlos:
          create: false

    vmsingle:
      spec:
        # -- Data retention period. Possible units character: h(ours), d(ays), w(eeks), y(ears), if no unit character specified - month. The minimum retention period is 24h. See these [docs](https://docs.victoriametrics.com/single-server-victoriametrics/#retention)
        retentionPeriod: "6w"
        replicaCount: 1
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
          storageClassName: truenas-iscsi
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 3000m
            memory: 6Gi
      route:
        enabled: true
        hostnames: ["${APP}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system

    alertmanager:
      # phase 1: OFF. kube-prometheus-stack's Alertmanager keeps ownership of
      # notifications throughout the migration, so alerting never moves and there
      # is no window of duplicate or missing pages.
      #
      # The config below is ALSO STALE and must be reworked before it is enabled:
      # it routes to Pushover, which predates this cluster's move to the Signal
      # bridge (Discord was removed 2026-08-23 once Signal was confirmed end to
      # end). At cutover, port the `notify` webhook receiver from
      # kube-prometheus-stack's values rather than turning this on as written.
      enabled: false
      useManagedConfig: true
      config:
        route:
          group_by: ["alertname", "job"]
          group_interval: 10m
          group_wait: 1m
          receiver: pushover
          repeat_interval: 12h
          routes:
            - receiver: "null"
              matchers:
                - alertname=InfoInhibitor
            - receiver: heartbeat
              group_interval: 15s
              group_wait: 0s
              repeat_interval: 5m
              matchers:
                - alertname=Watchdog
            - receiver: pushover
              matchers:
                - severity=~"warning|critical"
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
            equal: ["alertname", "namespace"]
        receivers:
          - name: "null"
          - name: heartbeat
            webhook_configs:
              - url_secret:
                  name: &secret alertmanager-secret
                  key: ALERTMANAGER_HEALTHCHECKSIO_URL
          - name: pushover
            pushover_configs:
              - html: true
                message: |-
                  {{- range .Alerts }}
                    {{- if ne .Annotations.description "" }}
                      {{ .Annotations.description }}
                    {{- else if ne .Annotations.summary "" }}
                      {{ .Annotations.summary }}
                    {{- else if ne .Annotations.message "" }}
                      {{ .Annotations.message }}
                    {{- else }}
                      Alert description not available
                    {{- end }}
                    {{- if gt (len .Labels.SortedPairs) 0 }}
                      <small>
                        {{- range .Labels.SortedPairs }}
                          <b>{{ .Name }}:</b> {{ .Value }}
                        {{- end }}
                      </small>
                    {{- end }}
                  {{- end }}
                priority: |-
                  {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
                send_resolved: true
                sound: gamelan
                title: >-
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
                  {{ .CommonLabels.alertname }}
                ttl: 86400s
                token:
                  name: *secret
                  key: PUSHOVER_ALERTMANAGER_TOKEN
                user_key:
                  name: *secret
                  key: PUSHOVER_USER_KEY
                url_title: View in Alertmanager

    vmalert:
      # phase 1: OFF. With the converter running, vmalert would evaluate copies of
      # the same rules Prometheus is already evaluating and fire a second set of
      # notifications. Enable at cutover, together with defaultRules.
      enabled: false
      spec:
        # Skip vmalerts for vmlog rules
        selectAllByDefault: false
        ruleSelector:
          matchExpressions:
            - key: vmalert-logs.io/enabled
              operator: NotIn
              values: ["true"]
        ruleNamespaceSelector:
          matchExpressions:
            - key: somekey
              operator: NotIn
              values: ["never-used-value"]

    vmagent:
      spec:
        extraArgs:
          promscrape.maxScrapeSize: 50MiB
          promscrape.streamParse: "true"
          promscrape.dropOriginalLabels: "true"
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 512Mi

    grafana:
      enabled: false

    kube-state-metrics:
      # phase 1: OFF. kube-prometheus-stack already runs kube-state-metrics; a
      # second copy would double every kube_* series. vmagent picks up the
      # existing one through its converted ServiceMonitor. Enable at cutover.
      enabled: false
      livenessProbe:
        httpGet:
          path: /healthz
          port: telemetry
        initialDelaySeconds: 60
        periodSeconds:       20
        failureThreshold:    6
      readinessProbe:
        httpGet:
          path: /readyz
          port: telemetry
        initialDelaySeconds: 30
        periodSeconds:       15
        failureThreshold:    5

    prometheus-node-exporter:
      # phase 1: OFF, same reasoning as kube-state-metrics -- a second DaemonSet
      # on every node duplicating node_* series. Enable at cutover.
      enabled: false
      vmScrape:
        spec:
          endpoints:
            - port: metrics
              relabelConfigs:
                - source_labels:
                    - __meta_kubernetes_endpoint_node_name
                  target_label: node

    # The chart's own control-plane scrape targets. In phase 1 these are OFF
    # because kube-prometheus-stack's equivalents are already being converted
    # into VMServiceScrapes -- leaving both on would scrape kubelet, apiserver
    # and CoreDNS twice into the same vmsingle. Turn all three back ON at
    # cutover, when the converted copies are garbage-collected with their source.
    kubelet:
      enabled: false
      vmScrape:
        spec:
          # drop high cardinality label and useless metrics for cadvisor and kubelet
          metricRelabelConfigs:
            # Drop less useful container CPU metrics.
            - sourceLabels: [__name__]
              action: drop
              regex: "container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)"
            # Drop less useful / always zero container memory metrics.
            - sourceLabels: [__name__]
              action: drop
              regex: "container_memory_(failures_total|mapped_file|swap)"
            # Drop less useful container process metrics.
            - sourceLabels: [__name__]
              action: drop
              # regex: 'container_(file_descriptors|tasks_state|threads_max)'
              regex: "container_(tasks_state|threads_max)"
            # Drop less useful container filesystem metrics.
            - sourceLabels: [__name__]
              action: drop
              regex: "container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)"
            # Drop less useful container blkio metrics.
            - sourceLabels: [__name__]
              action: drop
              regex: "container_blkio_device_usage_total"
            # Drop container spec metrics that overlap with kube-state-metrics.
            - sourceLabels: [__name__]
              action: drop
              regex: "container_spec.*"
            # Drop cgroup metrics with no pod.
            - sourceLabels: [id, pod]
              action: drop
              regex: ".+;"
            - action: drop
              sourceLabels: [__name__]
              regex: prober_probe_duration_seconds_bucket
            # Drop high-cardinality labels.
            - action: labeldrop
              regex: (uid|id|pod_uid|interface)
            - action: drop
              sourceLabels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

    kubeApiServer:
      enabled: false # phase 1 (see kubelet above)

    coreDns:
      enabled: false # phase 1 (see kubelet above)

    # These four were already off before the migration and stay off.
    kubeControllerManager:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    additionalVictoriaMetricsMap:
      dockerhub-rules:
        create: true
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        create: true
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      pod-failed-rules:
        create: true
        groups:
          - name: kube-pod-failures
            rules:
              - alert: KubePodFailed
                expr: |
                  sum(max(kube_pod_status_phase{namespace=~".*",job="kube-state-metrics",phase=~"Failed"})
                  by(namespace,pod,cluster) * on(namespace,pod,cluster) group_left(owner_kind)
                  topk(1, max(kube_pod_owner{owner_kind!="Job"}) by(namespace,pod,owner_kind,cluster))
                  by(namespace,pod,cluster)) by(namespace,pod,cluster) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: Pod has been in Failed state for more than 15 minutes
                  description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Failed state for longer than 15 minutes on cluster {{ $labels.cluster }}.

    # phase 1: EMPTY, deliberately.
    #
    # The block below defines a PrometheusRule (`custom-kube-apiserver-slos`) --
    # a *Prometheus* CR, not a VM one, so the kube-prometheus-stack Prometheus
    # that is running right now would pick it up and evaluate it immediately.
    # `KubeAPIErrorBudgetBurn` already exists today in
    # `kube-prometheus-stack-kube-apiserver-slos` with all four burn-rate
    # windows, so shipping this in phase 1 would define every one of those alerts
    # twice and page twice through the Signal bridge.
    #
    # It is the intended REPLACEMENT for those rules after cutover, when
    # kube-prometheus-stack (and its copy) is gone. Uncomment it in phase 2,
    # together with defaultRules, vmalert and the built-in scrape targets.
    extraObjects: []
    # extraObjects:
    #   - apiVersion: monitoring.coreos.com/v1
    #     kind: PrometheusRule
    #     metadata:
    #       name: custom-kube-apiserver-slos
    #       namespace: observability
    #     spec:
    #       groups:
    #         - name: kube-apiserver-slos
