---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app victoria-metrics-stack
  namespace: &namespace observability
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # vmsingle's volume is truenas-iscsi, not Ceph, but the chart's operator
    # installs CRDs that the rest of observability reconciles against, so it
    # follows the same ordering as kube-prometheus-stack.
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: victoria-metrics
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/observability/victoria-metrics/app
  postBuild:
    substitute:
      APP: vm
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  # Left false while phase 1 runs alongside kube-prometheus-stack: the operator
  # has to install its CRDs and converge a large set of converted CRs on first
  # apply, and blocking the rest of the observability tree behind that buys
  # nothing.
  wait: false
