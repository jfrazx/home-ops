---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret alertmanager-signal-bridge-secret
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-cluster-secretstore
  target:
    name: *secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Phone numbers are personal data, so they stay in OpenBao rather than
        # in git. Both must be E.164, e.g. +15555550123.
        #
        # number     - the linked account's own number (the sender)
        # recipients - comma-separated destinations; phone numbers, or a
        #              "group.<id>=" group id from GET /v1/groups/<number>
        SIGNAL_NUMBER: "{{ .number }}"
        SIGNAL_RECIPIENTS: "{{ .recipients }}"
  data:
    - secretKey: number
      remoteRef:
        key: shared/notifications/signal
        property: number

    - secretKey: recipients
      remoteRef:
        key: shared/notifications/signal
        property: recipients
