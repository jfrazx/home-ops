---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    - ../../../../components/keda/nfs-scaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: openebs
      namespace: openebs-system
  interval: 1h
  path: "./kubernetes/apps/downloaders/sabnzbd/app"
  patches:
    # Moved here from the downloads namespace. Volsync names a backup after
    # the namespace it was taken in (sabnzbd@downloads), and a restore
    # defaults to its own namespace, so without this the first restore here
    # finds no snapshot and starts sabnzbd on an empty config. New backups are
    # written as sabnzbd@downloaders; the RD is only created once
    # (ssa: IfNotPresent), so this can be dropped after the move.
    # Matched on kind alone: patches run before postBuild substitution, when
    # the name is still the literal "${APP}-dst".
    - target:
        kind: ReplicationDestination
      patch: |-
        - op: add
          path: /spec/kopia/sourceIdentity/sourceNamespace
          value: downloads
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CLAIM: sabnzbd-config
      VOLSYNC_REPOSITORY_NAMESPACE: &namespace downloaders
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
