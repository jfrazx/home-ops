---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sabnzbd
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          # Bulk downloaders saturate whichever node hosts them, so qbittorrent,
          # sabnzbd and nzbget each take their own node. Required rather than
          # preferred, since a preference can lose to other scheduler scores (all
          # three had landed on one node). 3 pods on 4 nodes still tolerates one
          # node down; with two down, one of them stays Pending until a node
          # returns.
          labels:
            home-ops/traffic: bulk-download
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      home-ops/traffic: bulk-download
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [568]
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3

            env:
              CROSS_SEED_HOST: cross-seed.downloads.svc.cluster.local:2468
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.downloaders,
                sabnzbd.downloaders.svc,
                sabnzbd.downloaders.svc.cluster,
                sabnzbd.downloaders.svc.cluster.local,
                sabnzbd.${SECRET_DOMAIN}

            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 5m
                memory: 1Gi
              limits:
                memory: 12Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: sabnzbd-config
        advancedMounts:
          sabnzbd:
            app:
              - path: /config

      downloads:
        type: nfs
        path: "/mnt/${SECRET_NFS_SHARE}/media"
        server: "${SECRET_NFS_SERVER}"
        globalMounts:
          - path: /data/media/downloads/usenet
            subPath: downloads/usenet

      # The `abs` dataset, so a download category can land inside the same
      # dataset as the Audiobookshelf library and be hardlinked on import
      # instead of copied. Anything written under downloads/ lives in a
      # different ZFS dataset, where link() fails with EXDEV.
      abs:
        type: nfs
        path: "/mnt/${SECRET_NFS_SHARE}/media/abs"
        server: "${SECRET_NFS_SERVER}"
        globalMounts:
          - path: /data/media/abs

      scripts:
        type: configMap
        defaultMode: 0775
        name: volsync-sabnzbd-scripts

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
            subPath: logs
          - path: /tmp
            subPath: tmp

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: SABnzbd
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: sabnzbd.svg
          gethomepage.dev/description: >-
            Usenet downloader ·
            {{ if eq (index .Values.route.app.parentRefs 0).name "external" }}External{{ else }}LAN only{{ end }}
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
