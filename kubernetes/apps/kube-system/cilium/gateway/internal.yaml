---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  annotations:
    # Unprefixed `external-dns.kubernetes.io/`, NOT the old
    # `external-dns.alpha.kubernetes.io/`: external-dns v0.22.0 defaults its
    # annotation prefix to the unprefixed form and silently ignores the alpha
    # one. Without this target, the gateway-httproute source falls back to
    # status.addresses (a private LAN IP) and Cloudflare rejects every proxied
    # record with code 9003, so new hostnames never get a public record.
    # The `infrastructure.annotations` hostname below is read by k8s-gateway
    # (internal DNS), not external-dns, and keeps the alpha prefix.
    external-dns.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "10.168.2.98"
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: "internal.${SECRET_DOMAIN}"
  listeners:
    # unifi-tls (TLS passthrough) listener removed 2026-08-02: it conflicted with
    # the wildcard `https` listener below on port 443 after the Cilium v1.20.0
    # upgrade started enforcing Gateway API hostname-overlap validation, which
    # broke every HTTPRoute on this Gateway. See
    # kubernetes/apps/network/unifi-controller/TLS-PASSTHROUGH-TODO.md for the
    # proper fix (separate Gateway/IP for passthrough).
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
