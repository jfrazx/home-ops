---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
# Plain-HTTP -> HTTPS redirect for both Gateways.
#
# These MUST live in the same namespace as the Gateways (kube-system). The `http`
# listener on each Gateway is deliberately `allowedRoutes.namespaces.from: Same`
# so that application namespaces cannot attach to it and serve plaintext — only
# these two redirect routes may bind port 80. Do not relax the listener to `All`
# to accommodate a route living elsewhere; move the route here instead.
#
# Previously lived in kubernetes/apps/network/traefik/app/route.yaml, where the
# traefik Kustomization's `targetNamespace: network` forced them into the wrong
# namespace and both were rejected with "not allowed to attach to this Gateway
# due to namespace restrictions".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-internal
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-external
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
