---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/volsync.backube/kopiamaintenance_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: kopia-daily-maintenance
  namespace: volsync
spec:
  repository:
    repository: volsync-secret
  trigger:
    schedule: "30 3 * * *"
  enabled: true
  # Repo blobs on the NFS backend are owned by uid/gid 1001 (matching the
  # ReplicationSource movers). Without this the maintenance job runs as the
  # image-default uid and gets "permission denied" reading /repository/.shards.
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    supplementalGroups: [100]
