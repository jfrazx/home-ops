---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: FluxInstance
      name: "*"
    - kind: GitRepository
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: OCIRepository
      name: "*"
  exclusionList:
    - "error.*lookup github\\.com"
    - "error.*lookup raw\\.githubusercontent\\.com"
    - "dial.*tcp.*timeout"
    - "waiting.*socket"
    # IPv4-only cluster (Cilium enable-ipv6=false) fetching from upstreams that
    # publish AAAA records: Go dials the v6 address, fails instantly, and the
    # retry succeeds. Roughly 70/day of pure noise. Scoped to bracketed IPv6
    # literals so a genuine IPv4 routing failure still alerts.
    - "dial tcp \\[[0-9a-fA-F:]+\\]:[0-9]+: connect: network is unreachable"
  suspend: false
