---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/notification.toolkit.fluxcd.io/provider_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  # Service is named after the kube-prometheus-stack release, not "alertmanager";
  # the bare name does not resolve and every notification failed to dispatch.
  address: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093/api/v2/alerts/
