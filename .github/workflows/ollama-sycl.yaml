---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Ollama SYCL Image"

on:
  workflow_dispatch:
    inputs:
      ollama_version:
        description: "Ollama version to build (without leading v), e.g. 0.31.1"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "docker/ollama-sycl/**"
      - ".github/workflows/ollama-sycl.yaml"
  schedule:
    - cron: "0 6 1 * *" # 1st of every month at 06:00 UTC — pick up new Ollama releases

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine Ollama Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.ollama_version }}" ]; then
            echo "version=${{ inputs.ollama_version }}" >> "$GITHUB_OUTPUT"
          else
            latest="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/ollama/ollama/releases/latest \
              | jq -er '.tag_name' | sed 's/^v//')"
            echo "version=${latest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: docker/ollama-sycl
          build-args: |
            OLLAMA_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ollama-sycl:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ollama-sycl:latest
