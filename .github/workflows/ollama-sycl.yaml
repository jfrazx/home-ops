---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Ollama SYCL Image"

on:
  workflow_dispatch:
    inputs:
      ollama_version:
        description: "Ollama version to build (without leading v), e.g. 0.31.1"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "docker/ollama-sycl/**"
      - ".github/workflows/ollama-sycl.yaml"
  schedule:
    - cron: "0 6 1 * *" # 1st of every month at 06:00 UTC — pick up new Ollama releases

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Ollama Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.ollama_version }}" ]; then
            echo "version=${{ inputs.ollama_version }}" >> "$GITHUB_OUTPUT"
          else
            latest="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/ollama/ollama/releases/latest \
              | jq -er '.tag_name' | sed 's/^v//')"
            echo "version=${latest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/ollama-sycl
          build-args: |
            OLLAMA_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ollama-sycl:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ollama-sycl:latest
